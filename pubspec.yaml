name: weeklet
description: "Weeklet is a Flutter app for simple personal finance
  management.   You can add your weekly expenses for each month, divided into
  categories such as   daily expenses, utilities, internet/TV, other, shopping,
  savings, and car.   The app automatically calculates weekly and monthly
  totals, and in the statistics section   you can see an annual overview—totals
  by category and total income.   Ideal for those who want control, clarity, and
  financial simplicity.  Translated with DeepL.com (free version)"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.0.7
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  get_it: ^9.0.5
  go_router: ^16.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.5
  path_provider: ^2.1.5

dev_dependencies:
  build_runner: ^2.4.7 # higher version is incompatible with hive
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
